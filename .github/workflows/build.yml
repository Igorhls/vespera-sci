name: Compilacao Multiplataforma & Releases

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar Release no GitHub (usa a versão do version.json)?"
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint e Suíte de Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.versao.outputs.version }}
      status: ${{ steps.versao.outputs.status }}
    steps:
      - name: Obter Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ler versão (version.json)
        id: versao
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open("version.json", encoding="utf-8"))
          print(f"version={v['version']}")
          print(f"status={v.get('status', '')}")
          EOF

      - name: Conferir tag x version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.versao.outputs.version }}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde ao version.json (v${{ steps.versao.outputs.version }})."
            exit 1
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Executar Testes
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python -m pytest tests -q

  build-windows:
    name: Compilar Executável Windows (x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Obter Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compilar com PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "VesperaSci" `
            --icon "assets/app_icon.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            --add-data "version.json;." `
            main.py

      - name: Compactar Pacote Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VesperaSci -DestinationPath dist/VesperaSci-Windows-x64.zip

      - name: Armazenar Artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: VesperaSci-Windows-x64
          path: dist/VesperaSci-Windows-x64.zip

  build-macos:
    name: Compilar macOS ${{ matrix.rotulo }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            rotulo: Apple Silicon (arm64)
            artefato: VesperaSci-macOS-AppleSilicon-arm64
          - runner: macos-15-intel
            rotulo: Intel (x86_64)
            artefato: VesperaSci-macOS-Intel-x86_64
    steps:
      - name: Obter Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pillow

      - name: Gerar Ícone ICNS do macOS
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/app_icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/app_icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app_icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o assets/app_icon.icns
          rm -rf AppIcon.iconset

      - name: Compilar Bundle .app
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "VesperaSci" \
            --icon "assets/app_icon.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --add-data "version.json:." \
            --osx-bundle-identifier "com.vesperasci.app" \
            main.py

      - name: Criar Imagem de Disco (.dmg)
        run: |
          mkdir -p dmg_root
          cp -r dist/VesperaSci.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Vespera Sci" -srcfolder dmg_root -ov -format UDZO "dist/${{ matrix.artefato }}.dmg"
          rm -rf dmg_root

      - name: Armazenar Artefato macOS
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: dist/${{ matrix.artefato }}.dmg

  publish-release:
    name: Publicar Release Oficial no GitHub
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: [test, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: v${{ needs.test.outputs.version }}
      TITULO: Vespera Sci v${{ needs.test.outputs.version }}${{ needs.test.outputs.status && format(' ({0})', needs.test.outputs.status) || '' }}
    steps:
      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITULO }}
          draft: false
          # Releases marcadas como prerelease não aparecem em /releases/latest, que é o que o
          # atualizador do app consulta. O status Beta vai no título.
          prerelease: false
          make_latest: true
          body: |
            ## ${{ env.TITULO }} — Estúdio Científico de Dados e Gráficos

            Ferramenta desktop para geração de gráficos científicos e relatórios analíticos nos padrões acadêmicos internacionais e ABNT.

            ### Instaladores Disponíveis para Download:
            * **Windows (64-bit)**: [`VesperaSci-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/VesperaSci-Windows-x64.zip) (Extraia o arquivo .zip e execute o `VesperaSci.exe`)
            * **macOS Apple Silicon (M1/M2/M3/M4)**: [`VesperaSci-macOS-AppleSilicon-arm64.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/VesperaSci-macOS-AppleSilicon-arm64.dmg)
            * **macOS Intel (x86_64)**: [`VesperaSci-macOS-Intel-x86_64.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/VesperaSci-macOS-Intel-x86_64.dmg)

            Cada arquivo tem seu SHA-256 publicado pelo GitHub; o atualizador do app confere esse hash antes de instalar.

            ---
            ### Instruções de Instalação no macOS:
            1. Abra o arquivo `.dmg` baixado e arraste o **Vespera Sci** para a pasta **Applications**.
            2. Na primeira inicialização, clique com o **botão direito > Abrir** (ou acesse *Ajustes do Sistema > Privacidade e Segurança > Abrir Mesmo Assim*).
          files: |
            release_assets/VesperaSci-Windows-x64/*
            release_assets/VesperaSci-macOS-AppleSilicon-arm64/*
            release_assets/VesperaSci-macOS-Intel-x86_64/*
