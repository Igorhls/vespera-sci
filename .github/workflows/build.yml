name: Multiplatform Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (pytest / unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          python -m unittest tests/test_all.py

  build-windows:
    name: Build Windows Standalone (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "VesperaSci" `
            --icon "assets/app_icon.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            main.py

      - name: Compress Windows Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VesperaSci -DestinationPath dist/VesperaSci-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VesperaSci-Windows-x64
          path: dist/VesperaSci-Windows-x64.zip

  build-macos-intel:
    name: Build macOS Intel (.dmg / macOS 13 Ventura)
    needs: test
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Convert App Icon to ICNS
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/app_icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/app_icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app_icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o assets/app_icon.icns

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "VesperaSci" \
            --icon "assets/app_icon.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --osx-bundle-identifier "com.vesperasci.app" \
            main.py

      - name: Create DMG Disk Image
        run: |
          mkdir -p dmg_root
          cp -r dist/VesperaSci.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Vespera Sci" -srcfolder dmg_root -ov -format UDZO dist/VesperaSci-macOS-Intel-x86_64.dmg

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: VesperaSci-macOS-Intel-x86_64
          path: dist/VesperaSci-macOS-Intel-x86_64.dmg

  build-macos-arm:
    name: Build macOS Apple Silicon (.dmg / M1/M2/M3/M4 Ventura+)
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Convert App Icon to ICNS
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/app_icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/app_icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app_icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o assets/app_icon.icns

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "VesperaSci" \
            --icon "assets/app_icon.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --osx-bundle-identifier "com.vesperasci.app" \
            main.py

      - name: Create DMG Disk Image
        run: |
          mkdir -p dmg_root
          cp -r dist/VesperaSci.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Vespera Sci" -srcfolder dmg_root -ov -format UDZO dist/VesperaSci-macOS-AppleSilicon-arm64.dmg

      - name: Upload macOS Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: VesperaSci-macOS-AppleSilicon-arm64
          path: dist/VesperaSci-macOS-AppleSilicon-arm64.dmg

  publish-release:
    name: Publish Official GitHub Release
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Vespera Sci Alpha — v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Vespera Sci Alpha — Scientific Plotting & Data Studio

            Bem-vindo ao release oficial do **Vespera Sci Desktop**, o estúdio de gráficos científicos nos padrões OriginLab Pro / ABNT.

            ### 📦 Instaladores Disponíveis para Download:
            * **Windows (64-bit)**: [`VesperaSci-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/VesperaSci-Windows-x64.zip) *(Extraia o arquivo .zip e execute o `VesperaSci.exe`)*
            * **macOS Apple Silicon (M1/M2/M3/M4)**: [`VesperaSci-macOS-AppleSilicon-arm64.dmg`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/VesperaSci-macOS-AppleSilicon-arm64.dmg) *(macOS 13 Ventura ou superior)*
            * **macOS Intel (x86_64)**: [`VesperaSci-macOS-Intel-x86_64.dmg`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/VesperaSci-macOS-Intel-x86_64.dmg) *(macOS 13 Ventura ou superior)*

            ---
            ### 🍎 Como Usar no Mac:
            1. Abra o arquivo `.dmg` baixado e arraste o **Vespera Sci** para a pasta **Applications**.
            2. Na primeira abertura, clique com o **botão direito > Abrir** (ou acesse *Ajustes do Sistema > Privacidade e Segurança > Abrir Mesmo Assim*).

            ---
            ### ✨ Principais Recursos:
            - **Gráficos de Linhas e Pontos**: Séries temporais térmicas completas (Manhã, Tarde, Noite).
            - **Gráficos de Barras com Desvio**: Médias e desvios padrão amostrais com padrões OriginLab hachurados.
            - **Dispersão & Regressão Linear**: Ajuste de reta de regressão com cálculo em tempo real do $R^2$, Pearson e erro padrão.
            - **Boxplot & Distribuição Térmica**: Quartis Q1/Q3, Mediana, Whiskers ($1{,}5 \times \text{IQR}$), médias e detecção de outliers.
            - **Colagem Direta do Excel**: Atalho `Ctrl+V` diretamente sobre as células do grid.
            - **Histórico Completo**: Desfazer e Refazer (`Ctrl+Z` / `Ctrl+Y`).
            - **Exportação Multiformato**: PNG (300 DPI), Vetor PDF, Vetor SVG e planilhas nativas do Microsoft Excel (.xlsx).
          files: |
            release_assets/VesperaSci-Windows-x64/*
            release_assets/VesperaSci-macOS-Intel-x86_64/*
            release_assets/VesperaSci-macOS-AppleSilicon-arm64/*
