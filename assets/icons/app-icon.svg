<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1338"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="256" height="256" rx="58" fill="url(#bg4)"/>
  <rect width="254" height="254" x="1" y="1" rx="57" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Coordinate Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="48" y1="64" x2="208" y2="64"/>
    <line x1="48" y1="104" x2="208" y2="104"/>
    <line x1="48" y1="144" x2="208" y2="144"/>
    <line x1="48" y1="184" x2="208" y2="184"/>
    <line x1="48" y1="64" x2="48" y2="184"/>
    <line x1="88" y1="64" x2="88" y2="184"/>
    <line x1="128" y1="64" x2="128" y2="184"/>
    <line x1="168" y1="64" x2="168" y2="184"/>
    <line x1="208" y1="64" x2="208" y2="184"/>
  </g>
  <path d="M48 64 V184 H208" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shaded Area Under Curve -->
  <path d="M48 160 C80 160, 100 148, 128 128 C156 108, 175 74, 204 68 V184 H48 Z" fill="url(#area-grad)"/>
  <!-- Past / Dotted Trajectory -->
  <path d="M48 160 C75 160, 95 150, 120 134" fill="none" stroke="#8b5cf6" stroke-width="4.5" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.65"/>
  <!-- Solid Surging Future Wave with Neon Glow -->
  <path d="M116 137 C138 122, 165 76, 204 68" fill="none" stroke="url(#wave-grad)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow4)"/>
  <!-- Glowing Inflection & Peak Nodes -->
  <circle cx="120" cy="134" r="4.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="204" cy="68" r="8" fill="#ffffff" filter="url(#glow4)"/>
  <circle cx="204" cy="68" r="4" fill="#06b6d4"/>
</svg>
